<!-- RED BLUR SECURITY OVERLAY -->
<div x-show="warningPageOpen" 
     x-transition:enter="transition ease-out duration-500"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-300"
     class="fixed inset-0 z-[200] flex items-center justify-center p-6 overflow-hidden" x-cloak>
    
    <!-- Background Blur Merah -->
    <div class="absolute inset-0 bg-red-950/80 backdrop-blur-[20px]"></div>
    
    <!-- Kandungan Amaran -->
    <div class="relative w-full max-w-2xl bg-white rounded-[3rem] p-10 md:p-16 shadow-[0_0_100px_rgba(220,38,38,0.5)] text-center border-4 border-red-500"
         x-show="warningPageOpen"
         x-transition:enter="transition ease-out duration-700 transform"
         x-transition:enter-start="scale-50 rotate-12"
         x-transition:enter-end="scale-100 rotate-0">
        
        <div class="w-24 h-24 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-5xl mx-auto mb-8 animate-pulse">
            ⚠️
        </div>
        
        <h2 class="heading-font text-4xl md:text-5xl font-black italic tracking-tighter text-slate-950 mb-4">
            SECURITY BREACH
        </h2>
        
        <div class="bg-red-50 p-6 rounded-2xl mb-8 border border-red-100">
            <p class="text-[10px] font-black uppercase tracking-[0.3em] text-red-600 mb-2">Detailed System Logs</p>
            <p class="text-slate-700 font-bold" x-text="'Target Account: ' + (alertDetails ? alertDetails.email : 'Unknown')"></p>
            <p class="text-slate-500 text-xs mt-1" x-text="'Detected at: ' + (alertDetails ? alertDetails.time : 'N/A')"></p>
            <p class="text-[10px] text-red-500 font-black mt-4 uppercase">Status: Unauthorized Access Attempts Blocked</p>
        </div>

        <div class="flex flex-col gap-4">
            <button @click="warningPageOpen = false; securityAlert = false; loginAttempts = 0" 
                    class="w-full bg-red-600 text-white py-5 rounded-2xl font-black heading-font italic uppercase tracking-widest hover:bg-slate-950 transition-all shadow-xl active:scale-95">
                Take Action & Dismiss Alert
            </button>
            <button @click="warningPageOpen = false" 
                    class="text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-slate-600">
                Close Preview
            </button>
        </div>
    </div>
</div>
